name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Arabic Language and Region
        run: |
          # تحميل وتثبيت حزمة اللغة العربية
          Install-Language ar-SA -Confirm:$false
          Set-SystemPreferredUILanguage ar-SA
          Set-WinSystemLocale ar-SA
          Set-WinUserLanguageList -LanguageList ar-SA, en-US -Force
          Set-WinHomeLocation -GeoId 70 # كود المنطقة لمصر كمثال

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Allow"
          netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Static Password
        run: |
          $password = "Admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath $env:USERPROFILE\ngrok -Force
          $ngrokPath = "$env:USERPROFILE\ngrok"
          echo "$ngrokPath" >> $env:GITHUB_PATH

      - name: Authenticate ngrok
        run: |
          & $env:USERPROFILE\ngrok\ngrok.exe authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Start ngrok TCP tunnel
        run: |
          Start-Process -FilePath "$env:USERPROFILE\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: Get ngrok RDP Address
        run: |
          $tunnel = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4040/api/tunnels
          $json = $tunnel.Content | ConvertFrom-Json
          $public = $json.tunnels.public_url -replace "tcp://",""
          echo "NGROK_RDP=$public" >> $env:GITHUB_ENV

      - name: Show RDP Info
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Host: $env:NGROK_RDP"
          Write-Host "User: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "Language: Arabic (ar-SA)"
          Write-Host "==================`n"

      - name: Keep alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
